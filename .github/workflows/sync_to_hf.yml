name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Error: HF_TOKEN secret is missing in GitHub repository settings."
            exit 1
          fi
          # Default to YashWankhade-ai/campusx or custom secret
          REPO="${HF_SPACE_REPO:-YashWankhade-ai/campusx}"
          git push --force "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${REPO}" main
