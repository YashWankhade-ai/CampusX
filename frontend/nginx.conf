server {
    listen 80;
    server_name localhost;

    # Allow large PDF textbook and notes uploads up to 100MB
    client_max_body_size 100M;

    # DNS resolver for upstream lookups
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Global proxy to Hugging Face ZeroGPU backend
    location / {
        set $backend https://yash1190-campusx.hf.space;
        proxy_pass $backend;

        # Forward correct host to Hugging Face router
        proxy_set_header Host yash1190-campusx.hf.space;
        proxy_ssl_server_name on;
        proxy_ssl_name yash1190-campusx.hf.space;

        # Client IP and Protocol headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support for real-time AI and chat streaming
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable gzip from upstream so Nginx can rewrite all content
        proxy_set_header Accept-Encoding "";

        # Rewrite redirect location headers so users stay on Render domain
        proxy_redirect https://yash1190-campusx.hf.space/ /;
        proxy_redirect http://yash1190-campusx.hf.space/ /;
        proxy_redirect https://yash1190-campusx.hf.space /;
        proxy_redirect http://yash1190-campusx.hf.space /;
        proxy_redirect https://huggingface.co/spaces/yash1190/CampusX/ /;
        proxy_redirect https://huggingface.co/spaces/yash1190/CampusX /;

        # Rewrite cookies so sessions persist on Render domain
        proxy_cookie_domain yash1190-campusx.hf.space $host;
        proxy_cookie_domain .hf.space $host;
        proxy_cookie_path / /;

        # Replace any Hugging Face URLs in the HTML/JS response body with Render host
        sub_filter 'https://yash1190-campusx.hf.space' '';
        sub_filter 'http://yash1190-campusx.hf.space' '';
        sub_filter 'yash1190-campusx.hf.space' '$host';
        sub_filter_once off;
        sub_filter_types text/html text/plain text/css application/javascript application/json;

        # Generous timeouts for heavy AI model responses
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffer sizing
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }
}
